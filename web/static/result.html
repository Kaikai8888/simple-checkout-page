<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>訂單結果</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar"><a href="/">← 商品列表</a><span class="sub">Checkout Demo</span><a class="nav" href="/admin.html" target="_blank" rel="noopener">Demo 後台 ↗</a></div>
<div class="container" style="max-width:720px">
  <div id="error" class="errors hidden"></div>
  <div id="order" class="panel hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <h2 style="margin:0" id="headline"></h2>
      <span class="status" id="status"></span>
    </div>
    <p class="muted" id="subline"></p>
    <div id="payment-hint" class="hint hidden"></div>
    <div id="actions" class="card-actions"></div>

    <div class="section-title" style="margin-top:24px">訂單明細</div>
    <table>
      <thead><tr><th>商品</th><th>單價</th><th>數量</th><th style="text-align:right">小計</th></tr></thead>
      <tbody id="lines"></tbody>
    </table>
    <div class="summary" id="totals"></div>

    <div class="section-title">收件資訊</div>
    <div id="shipping" style="font-size:14px"></div>
  </div>
</div>
<script src="/common.js"></script>
<script src="/result.js"></script>
</body>
</html>
