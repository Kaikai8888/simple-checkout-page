<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 後台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="topbar"><a href="/">Demo 後台</a><span class="sub">調整商品價格 / 庫存</span><a class="nav" href="/">商品列表</a></div>
<div class="container" style="max-width:860px">
  <div class="hint">開著結帳頁，在這裡改價格或庫存，再回到結帳頁送出訂單，就能示範「價格變動 / 庫存不足」的流程。
    更新會先寫 DB，在 commit 前同步 Valkey cache，兩者都成功才算成功。</div>
  <div class="panel" style="margin-top:12px;overflow-x:auto">
    <table>
      <thead><tr><th>ID</th><th>商品</th><th>類型</th><th>價格</th><th>可售庫存</th><th></th></tr></thead>
      <tbody id="admin"></tbody>
    </table>
  </div>
  <p class="muted" id="msg"></p>
</div>
<script src="/common.js"></script>
<script>
  load();

  async function load() {
    const { products } = await api.get('/api/products');
    document.getElementById('admin').innerHTML = products.map((p) => `
      <tr>
        <td>${p.id}</td>
        <td>${escapeHtml(p.name)}</td>
        <td class="muted">${p.is_addon ? '加購' : '主商品'}</td>
        <td><input type="number" min="0" id="price-${p.id}" value="${p.price}"></td>
        <td><input type="number" min="0" id="stock-${p.id}" value="${p.stock}"></td>
        <td><button class="btn btn-ghost btn-small" onclick="save(${p.id})">更新</button></td>
      </tr>`).join('');
  }

  async function save(id) {
    const price = Number(document.getElementById(`price-${id}`).value);
    const stock = Number(document.getElementById(`stock-${id}`).value);
    const msg = document.getElementById('msg');
    try {
      const p = await api.put(`/api/admin/products/${id}`, { price, stock });
      msg.textContent = `✔ 已更新 #${p.id} ${p.name}：${money(p.price)}，可售 ${p.stock}（${new Date().toLocaleTimeString()}）`;
      await load();
    } catch (err) {
      msg.textContent = `✘ 更新失敗：${err.message}`;
    }
  }
</script>
</body>
</html>
